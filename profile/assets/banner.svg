<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="StockProof &#8212; Firmar o no firmar">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0E11"/>
      <stop offset="1" stop-color="#1A1F26"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F0B90B"/>
      <stop offset="1" stop-color="#F8D33A"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#F0B90B" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1200" height="340" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="24" fill="url(#grid)"/>
  <circle cx="1030" cy="150" r="110" fill="#F0B90B" opacity="0.12" filter="url(#glow)"/>

  <!-- candles -->
  <g opacity="0.18" stroke-width="2">
    <line x1="820" y1="60" x2="820" y2="140" stroke="#2EBD85"/><rect x="812" y="80" width="16" height="40" fill="#2EBD85"/>
    <line x1="850" y1="90" x2="850" y2="170" stroke="#F6465D"/><rect x="842" y="105" width="16" height="45" fill="#F6465D"/>
    <line x1="880" y1="70" x2="880" y2="150" stroke="#2EBD85"/><rect x="872" y="85" width="16" height="35" fill="#2EBD85"/>
    <line x1="910" y1="110" x2="910" y2="200" stroke="#F6465D"/><rect x="902" y="125" width="16" height="50" fill="#F6465D"/>
  </g>

  <!-- shield -->
  <g transform="translate(985 70)">
    <path d="M45 0 L90 18 V62 C90 98 70 122 45 136 C20 122 0 98 0 62 V18 Z" fill="none" stroke="url(#gold)" stroke-width="5" stroke-linejoin="round"/>
    <path d="M24 68 L40 84 L68 52" fill="none" stroke="url(#gold)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- title -->
  <text x="70" y="128" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="72" font-weight="800" fill="#FFFFFF" letter-spacing="-1.5">Stock<tspan fill="#F0B90B">Proof</tspan></text>
  <text x="72" y="176" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="600" fill="#EAECEF">Firmar o no firmar.</text>
  <text x="72" y="210" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#848E9C">Cuatro preguntas antes del swap de una acci&#243;n tokenizada en BSC.</text>

  <!-- four steps -->
  <g font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600">
    <g transform="translate(70 252)">
      <rect width="150" height="40" rx="20" fill="#F0B90B" fill-opacity="0.1" stroke="#F0B90B" stroke-opacity="0.5"/>
      <text x="75" y="26" text-anchor="middle" fill="#F0B90B">1 &#183; Contrato</text>
    </g>
    <text x="232" y="278" fill="#5E6673" font-size="18">&#8594;</text>
    <g transform="translate(256 252)">
      <rect width="150" height="40" rx="20" fill="#F0B90B" fill-opacity="0.1" stroke="#F0B90B" stroke-opacity="0.5"/>
      <text x="75" y="26" text-anchor="middle" fill="#F0B90B">2 &#183; Liquidez</text>
    </g>
    <text x="418" y="278" fill="#5E6673" font-size="18">&#8594;</text>
    <g transform="translate(442 252)">
      <rect width="150" height="40" rx="20" fill="#F0B90B" fill-opacity="0.1" stroke="#F0B90B" stroke-opacity="0.5"/>
      <text x="75" y="26" text-anchor="middle" fill="#F0B90B">3 &#183; Precio</text>
    </g>
    <text x="604" y="278" fill="#5E6673" font-size="18">&#8594;</text>
    <g transform="translate(628 252)">
      <rect width="150" height="40" rx="20" fill="#F0B90B" fill-opacity="0.1" stroke="#F0B90B" stroke-opacity="0.5"/>
      <text x="75" y="26" text-anchor="middle" fill="#F0B90B">4 &#183; R&#233;gimen</text>
    </g>
    <text x="790" y="278" fill="#5E6673" font-size="18">&#8594;</text>
    <g transform="translate(814 252)">
      <rect width="120" height="40" rx="20" fill="#2EBD85" fill-opacity="0.15" stroke="#2EBD85" stroke-opacity="0.7"/>
      <text x="60" y="26" text-anchor="middle" fill="#2EBD85">&#10003; Firma</text>
    </g>
  </g>
</svg>
