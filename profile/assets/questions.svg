<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Las cuatro preguntas de StockProof">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E2329"/>
      <stop offset="1" stop-color="#161A1E"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="420" rx="24" fill="#0B0E11"/>

  <g font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
    <!-- card 1 -->
    <g transform="translate(30 30)">
      <rect width="555" height="165" rx="18" fill="url(#card)" stroke="#2B3139"/>
      <rect x="0" y="0" width="6" height="165" rx="3" fill="#F0B90B"/>
      <circle cx="54" cy="52" r="24" fill="#F0B90B" fill-opacity="0.12" stroke="#F0B90B"/>
      <text x="54" y="60" text-anchor="middle" font-size="22" font-weight="800" fill="#F0B90B">1</text>
      <text x="94" y="60" font-size="24" font-weight="700" fill="#FFFFFF">&#191;Este contrato es el real?</text>
      <text x="32" y="108" font-size="16" fill="#848E9C">Lista oficial, attestation y est&#225;ndar del token.</text>
      <text x="32" y="140" font-size="15" font-weight="600" fill="#F6465D">&#10005; Si falla: corta. No hay swap.</text>
    </g>
    <!-- card 2 -->
    <g transform="translate(615 30)">
      <rect width="555" height="165" rx="18" fill="url(#card)" stroke="#2B3139"/>
      <rect x="0" y="0" width="6" height="165" rx="3" fill="#F0B90B"/>
      <circle cx="54" cy="52" r="24" fill="#F0B90B" fill-opacity="0.12" stroke="#F0B90B"/>
      <text x="54" y="60" text-anchor="middle" font-size="22" font-weight="800" fill="#F0B90B">2</text>
      <text x="94" y="60" font-size="24" font-weight="700" fill="#FFFFFF">&#191;Entra y se puede salir?</text>
      <text x="32" y="108" font-size="16" fill="#848E9C">Compra y venta del mismo monto en bStocks, Ondo y xStocks.</text>
      <text x="32" y="140" font-size="15" font-weight="600" fill="#F6465D">&#10005; Si falla: devuelve el monto que s&#237; pasar&#237;a.</text>
    </g>
    <!-- card 3 -->
    <g transform="translate(30 225)">
      <rect width="555" height="165" rx="18" fill="url(#card)" stroke="#2B3139"/>
      <rect x="0" y="0" width="6" height="165" rx="3" fill="#F0B90B"/>
      <circle cx="54" cy="52" r="24" fill="#F0B90B" fill-opacity="0.12" stroke="#F0B90B"/>
      <text x="54" y="60" text-anchor="middle" font-size="22" font-weight="800" fill="#F0B90B">3</text>
      <text x="94" y="60" font-size="24" font-weight="700" fill="#FFFFFF">&#191;Este n&#250;mero es la acci&#243;n?</text>
      <text x="32" y="108" font-size="16" fill="#848E9C">Precio de referencia vs. pool y multiplicador de dividendos.</text>
      <text x="32" y="140" font-size="15" font-weight="600" fill="#F6465D">&#10005; Si el desv&#237;o no tiene causa: corta.</text>
    </g>
    <!-- card 4 -->
    <g transform="translate(615 225)">
      <rect width="555" height="165" rx="18" fill="url(#card)" stroke="#2B3139"/>
      <rect x="0" y="0" width="6" height="165" rx="3" fill="#F0B90B"/>
      <circle cx="54" cy="52" r="24" fill="#F0B90B" fill-opacity="0.12" stroke="#F0B90B"/>
      <text x="54" y="60" text-anchor="middle" font-size="22" font-weight="800" fill="#F0B90B">4</text>
      <text x="94" y="60" font-size="24" font-weight="700" fill="#FFFFFF">&#191;En qu&#233; r&#233;gimen est&#225;?</text>
      <text x="32" y="108" font-size="16" fill="#848E9C">Horario de mercado, libro clavado y pools que no coinciden.</text>
      <text x="32" y="140" font-size="15" font-weight="600" fill="#F6465D">&#10005; Pools que no coinciden o salida sobre el tope: corta.</text>
    </g>
  </g>
</svg>
